<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Planner</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <h2>Travel Days</h2>
            <div class="start-day-selector">
                <label for="start-day">Start Date:</label>
                <input type="date" id="start-day">
            </div>
            <nav class="day-nav" id="day-nav">
                <!-- Day buttons will be generated by JavaScript -->
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="content-header">
                <h1 id="day-title">Day 1 - Checkpoints</h1>
                <button class="add-btn" id="add-checkpoint">+ Add Checkpoint</button>
            </header>

            <div class="table-container">
                <table class="checkpoint-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Location</th>
                            <th>Google Maps</th>
                            <th>Cost ($)</th>
                            <th>Start Time</th>
                            <th>End Time</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="checkpoint-body">
                        <!-- Checkpoints will be rendered here -->
                    </tbody>
                </table>
                <div class="total-cost">
                    <strong>Total Cost: $<span id="total-cost">0.00</span></strong>
                </div>
            </div>
        </main>
    </div>

    <!-- Add/Edit Modal -->
    <div class="modal" id="checkpoint-modal">
        <div class="modal-content">
            <h2 id="modal-title">Add Checkpoint</h2>
            <form id="checkpoint-form">
                <input type="hidden" id="checkpoint-id">
                
                <div class="form-group">
                    <label for="location">Location Name</label>
                    <input type="text" id="location" required placeholder="e.g., Eiffel Tower">
                </div>

                <div class="form-group">
                    <label for="google-map-link">Google Maps Link</label>
                    <input type="url" id="google-map-link" placeholder="https://maps.google.com/...">
                </div>

                <div class="form-group">
                    <label for="cost">Expected Cost ($)</label>
                    <input type="number" id="cost" step="0.01" min="0" value="0" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="start-time">Start Time</label>
                        <input type="time" id="start-time" required>
                    </div>
                    <div class="form-group">
                        <label for="end-time">End Time</label>
                        <input type="time" id="end-time" required>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-cancel" id="cancel-btn">Cancel</button>
                    <button type="submit" class="btn-save">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
